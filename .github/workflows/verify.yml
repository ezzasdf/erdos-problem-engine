name: EMVE Verification & Reproducibility Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-audit:
    name: Python Audit & Reproducibility Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy sympy

      - name: Run Standalone M=19 Auditor (Zero-Trust Stdlib Check)
        run: |
          python scripts/check_certificate.py eval_package/M19_collatz_wielandt.json

      - name: Run Clean-Room Evaluation Suite (eval_package.zip Unpack & 23 Certs)
        run: |
          python scripts/test_clean_environment.py

      - name: Run Full Reproducibility Suite (6 Test Stages)
        run: |
          python scripts/test_reproducibility.py

  rust-exploration:
    name: Rust Exploration Engines Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build and Verify verify_erdos_rs
        run: |
          cd verify_erdos_rs
          cargo build --release
          cargo run --release -- --two-sided 17 17

      - name: Build and Verify verify_middle
        run: |
          cd verify_middle
          cargo build --release
          cargo run --release -- --verify 1000

  lean-verification:
    name: Lean 4 Standalone Kernel Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Lean 4 via elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -y --default-toolchain leanprover/lean4:v4.12.0
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Verify CertCheck.lean (Kernel Reflexivity & 6 Negative Theorems)
        run: |
          $HOME/.elan/bin/lean lean/CertCheck.lean
          $HOME/.elan/bin/lean eval_package/CertCheck.lean
